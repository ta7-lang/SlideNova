name: Сборка SlideNova
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Поиск исходников
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter 'SlideNova*.zip' -File -Recurse -Depth 1 | Select-Object -First 1
          if ($zip -and -not (Test-Path 'build.ps1')) { Expand-Archive $zip.FullName '_src' -Force; $s = Get-ChildItem '_src' -Filter build.ps1 -Recurse | Select-Object -First 1 }
          else { $s = Get-ChildItem . -Filter build.ps1 -Recurse -Depth 2 | Select-Object -First 1 }
          "SN_SRC=$($s.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Сборка
        shell: pwsh
        env: { SN_VERSION: '1.0.${{ github.run_number }}' }
        run: '& (Join-Path $env:SN_SRC "build.ps1")'
      - uses: actions/upload-artifact@v4
        with: { name: SlideNova-portable-win-x64, path: '${{ env.SN_SRC }}/dist/SlideNova/' }
      - uses: actions/upload-artifact@v4
        with: { name: SlideNova-Setup-win-x64, path: '${{ env.SN_SRC }}/dist/SlideNova-Setup-*.exe', if-no-files-found: warn }
